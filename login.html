<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — College Memories</title>

  <style>
    *, *::before, *::after {
      margin: 0; padding: 0;
      box-sizing: border-box;
    }

    :root {
      --cyan:   #00d4ff;
      --orange: #ff6b35;
      --gold:   #ffd166;
      --white:  #f0f4ff;
      --glass:  rgba(5, 10, 30, 0.55);
    }

    html, body {
      width: 100%; height: 100%;
      overflow: hidden;
      font-family: 'Rajdhani', sans-serif;
      background: #000;
      cursor: none;
    }

    /* ── CUSTOM CURSOR ── */
    #cursor {
      position: fixed;
      width: 14px; height: 14px;
      border-radius: 50%;
      background: var(--cyan);
      pointer-events: none;
      z-index: 9999;
      transform: translate(-50%, -50%);
      mix-blend-mode: screen;
      transition: transform 0.1s, width 0.2s, height 0.2s;
      box-shadow: 0 0 12px var(--cyan), 0 0 24px var(--cyan);
    }
    #cursor-ring {
      position: fixed;
      width: 38px; height: 38px;
      border-radius: 50%;
      border: 1.5px solid rgba(0,212,255,0.5);
      pointer-events: none;
      z-index: 9998;
      transform: translate(-50%, -50%);
      transition: transform 0.12s ease, width 0.25s, height 0.25s, border-color 0.25s;
    }

    /* ── PARALLAX SCENE ── */
    #scene {
      position: fixed;
      inset: -80px;               /* oversized so panning never shows edges */
      will-change: transform;
    }

    #nebula-bg {
      position: absolute;
      inset: 0;
      background: url('https://images.unsplash.com/photo-1462331940025-496dfbfc7564?q=80&w=2200&auto=format&fit=crop') center/cover no-repeat;
      /* fallback in case user's image isn't served — we'll inline it below */
    }

    /* Depth layers for parallax illusion */
    .depth-layer {
      position: absolute;
      inset: 0;
      pointer-events: none;
    }

    #layer-glow {
      background: radial-gradient(ellipse 60% 50% at 55% 45%,
        rgba(0,212,255,0.18) 0%,
        rgba(255,107,53,0.10) 50%,
        transparent 80%);
      mix-blend-mode: screen;
      will-change: transform;
    }

    #layer-vignette {
      background: radial-gradient(ellipse 100% 100% at 50% 50%,
        transparent 40%,
        rgba(0,0,0,0.85) 100%);
    }

    /* Star particles */
    #particles {
      position: absolute; inset: 0;
      overflow: hidden;
    }
    .star {
      position: absolute;
      border-radius: 50%;
      background: white;
      animation: twinkle var(--dur, 3s) ease-in-out infinite alternate;
      opacity: var(--op, 0.6);
    }
    @keyframes twinkle {
      from { opacity: var(--op); transform: scale(1); }
      to   { opacity: calc(var(--op) * 0.3); transform: scale(0.6); }
    }

    /* ── CARD ── */
    #login-card {
      position: fixed;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      z-index: 100;
      width: 420px;
      padding: 52px 48px 44px;
      background: var(--glass);
      border: 1px solid rgba(0, 212, 255, 0.2);
      border-radius: 28px;
      backdrop-filter: blur(22px) saturate(1.4);
      box-shadow:
        0 0 0 1px rgba(255,255,255,0.04) inset,
        0 30px 80px rgba(0,0,0,0.6),
        0 0 60px rgba(0,212,255,0.08);
      animation: cardIn 0.9s cubic-bezier(0.16,1,0.3,1) forwards;
      opacity: 0;
    }
    @keyframes cardIn {
      from { opacity:0; transform: translate(-50%,-44%) scale(0.96); }
      to   { opacity:1; transform: translate(-50%,-50%) scale(1); }
    }

    /* top accent bar */
    #login-card::before {
      content: '';
      position: absolute;
      top: 0; left: 15%; right: 15%;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--cyan), var(--orange), transparent);
      border-radius: 2px;
    }

    .card-logo {
      text-align: center;
      margin-bottom: 32px;
    }
    .card-logo .icon {
      font-size: 36px;
      margin-bottom: 10px;
      display: block;
      filter: drop-shadow(0 0 12px var(--cyan));
    }
    .card-logo h1 {
      font-family: 'Cormorant Garamond', serif;
      font-weight: 300;
      font-size: 26px;
      letter-spacing: 4px;
      color: var(--white);
      text-transform: uppercase;
    }
    .card-logo p {
      font-size: 12px;
      letter-spacing: 3px;
      color: var(--cyan);
      text-transform: uppercase;
      margin-top: 4px;
      opacity: 0.8;
    }

    .divider {
      width: 60px; height: 1px;
      background: linear-gradient(90deg, transparent, rgba(0,212,255,0.5), transparent);
      margin: 0 auto 32px;
    }

    /* inputs */
    .field {
      position: relative;
      margin-bottom: 20px;
    }
    .field label {
      display: block;
      font-size: 11px;
      letter-spacing: 2.5px;
      text-transform: uppercase;
      color: rgba(0,212,255,0.7);
      margin-bottom: 8px;
    }
    .field input {
      width: 100%;
      padding: 14px 18px;
      background: rgba(255,255,255,0.05);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: 12px;
      color: var(--white);
      font-family: 'Rajdhani', sans-serif;
      font-size: 16px;
      outline: none;
      transition: border-color 0.3s, box-shadow 0.3s, background 0.3s;
    }

<body>

  <script>
    /* ─── CURSOR ─── */
    const cursor     = document.getElementById('cursor');
    const cursorRing = document.getElementById('cursor-ring');
    let cx = window.innerWidth/2, cy = window.innerHeight/2;
    let rx = cx, ry = cy;

    document.addEventListener('mousemove', e => { cx = e.clientX; cy = e.clientY; });

    function tickCursor() {
      cursor.style.left = cx + 'px';
      cursor.style.top  = cy + 'px';
      rx += (cx - rx) * 0.12;
      ry += (cy - ry) * 0.12;
      cursorRing.style.left = rx + 'px';
      cursorRing.style.top  = ry + 'px';
      requestAnimationFrame(tickCursor);
    }
    tickCursor();

    document.querySelectorAll('input, button, a').forEach(el => {
      el.addEventListener('mouseenter', () => {
        cursor.style.width  = '24px';
        cursor.style.height = '24px';
        cursorRing.style.width  = '52px';
        cursorRing.style.height = '52px';
        cursorRing.style.borderColor = 'rgba(255,107,53,0.7)';
      });
      el.addEventListener('mouseleave', () => {
        cursor.style.width  = '14px';
        cursor.style.height = '14px';
        cursorRing.style.width  = '38px';
        cursorRing.style.height = '38px';
        cursorRing.style.borderColor = 'rgba(0,212,255,0.5)';
      });
    });

    /* ─── STAR PARTICLES ─── */
    const pContainer = document.getElementById('particles');
    for (let i = 0; i < 120; i++) {
      const s = document.createElement('div');
      s.className = 'star';
      const size = Math.random() * 2.5 + 0.5;
      const op   = Math.random() * 0.6 + 0.2;
      const dur  = (Math.random() * 4 + 2).toFixed(1);
      s.style.cssText = `
        width:${size}px; height:${size}px;
        left:${Math.random()*100}%;
        top:${Math.random()*100}%;
        --op:${op}; --dur:${dur}s;
        animation-delay:${(Math.random()*5).toFixed(1)}s;
      `;
      pContainer.appendChild(s);
    }

    /* ─── 3D PARALLAX ─── */
    const scene     = document.getElementById('scene');
    const nebulaLoc = document.getElementById('nebula-local');
    const nebulaBg  = document.getElementById('nebula-bg');
    const layerGlow = document.getElementById('layer-glow');

    let mouseActive = false;
    let mx = 0, my = 0;          // normalized -1..1
    let autoAngle = 0;           // auto-drift angle
    let tx = 0, ty = 0;          // current translated position
    let targetX = 0, targetY = 0;

    const MAX_SHIFT = 40;        // max px offset
    const AUTO_SPEED = 0.004;

    // Reset mouse active flag after 1.5s of no movement (faster idle trigger)
    let mouseTimer;
    document.addEventListener('mousemove', e => {
      mouseActive = true;
      mx = (e.clientX / window.innerWidth  - 0.5) * 2;
      my = (e.clientY / window.innerHeight - 0.5) * 2;
      clearTimeout(mouseTimer);
      mouseTimer = setTimeout(() => { mouseActive = false; }, 1500);
    });

    function animateScene() {
      if (mouseActive) {
        targetX = mx * MAX_SHIFT;
        targetY = my * MAX_SHIFT;
      } else {
        // auto circular drift
        autoAngle += AUTO_SPEED;
        targetX = Math.sin(autoAngle) * (MAX_SHIFT * 0.6);
        targetY = Math.cos(autoAngle * 0.7) * (MAX_SHIFT * 0.4);
      }

      // Smooth easing
      tx += (targetX - tx) * 0.08;
      ty += (targetY - ty) * 0.08;

      // Apply transforms with different depth multipliers
      scene.style.transform     = `translate(${tx * 1}px, ${ty * 1}px)`;
      nebulaLoc.style.transform = `translate(${tx * -0.3}px, ${ty * -0.3}px) scale(1.05)`;
      layerGlow.style.transform = `translate(${tx * 0.5}px, ${ty * 0.5}px)`;

      requestAnimationFrame(animateScene);
    }
    animateScene();

    /* ─── BUTTON RIPPLE ─── */
    document.getElementById('btn-login').addEventListener('click', function(e) {
      const r = document.createElement('span');
      r.className = 'ripple';
      const rect = this.getBoundingClientRect();
      const size = Math.max(rect.width, rect.height);
      r.style.width = r.style.height = size + 'px';
      r.style.left = (e.clientX - rect.left - size/2) + 'px';
      r.style.top  = (e.clientY - rect.top  - size/2) + 'px';
      this.appendChild(r);
      setTimeout(() => r.remove(), 700);
    });
    document.getElementById('btn-google').addEventListener('click', function(e) {
      const r = document.createElement('span');
      r.className = 'ripple';
      const rect = this.getBoundingClientRect();
      const size = Math.max(rect.width, rect.height);
      r.style.width = r.style.height = size + 'px';
      r.style.left = (e.clientX - rect.left - size/2) + 'px';
      r.style.top  = (e.clientY - rect.top  - size/2) + 'px';
      this.appendChild(r);
      setTimeout(() => r.remove(), 700);
    });

    /* ─── OTP LOGIN ─── */

const emailInput = document.getElementById("email");
const otpInput = document.getElementById("otp");
const otpField = document.getElementById("otp-field");
const loginButton = document.getElementById("btn-login");

let otpSent = false;

loginButton.addEventListener("click", async function () {

    // STEP 1: SEND OTP
    if (!otpSent) {

        const email = emailInput.value.trim();

        if (!email) {
            alert("Please enter your email.");
            return;
        }

        if (!emailInput.checkValidity()) {
            alert("Please enter a valid email.");
            return;
        }

        loginButton.disabled = true;
        loginButton.textContent = "SENDING...";

        try {

            const response = await fetch("http://localhost:3000/send-otp", {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    email: email
                })
            });

            const data = await response.json();

            if (data.success) {

                otpSent = true;

                otpField.style.display = "block";

                loginButton.textContent = "VERIFY OTP";

                otpInput.focus();
                startResendTimer();

                alert("OTP sent to your email.");

            } else {

                alert(data.message);

                loginButton.textContent = "LOGIN";
            }

        } catch (error) {

            console.error(error);

            alert("Cannot connect to the server.");

            loginButton.textContent = "LOGIN";

        } finally {

            loginButton.disabled = false;
        }

        return;
    }


    // STEP 2: VERIFY OTP

    const email = emailInput.value.trim();
    const otp = otpInput.value.trim();

    if (!otp) {
        alert("Please enter the OTP.");
        return;
    }

    if (!/^\d{6}$/.test(otp)) {
        alert("OTP must be exactly 6 digits.");
        return;
    }

    loginButton.disabled = true;
    loginButton.textContent = "VERIFYING...";

    try {

        const response = await fetch("http://localhost:3000/verify-otp", {
            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                email: email,
                otp: otp
            })
        });

        const data = await response.json();

        if (data.success) {

    alert("Login successful!");

    localStorage.setItem("isLoggedIn", "true");

    window.location.href = "index.html";
}

         else {

            alert(data.message);

            loginButton.textContent = "VERIFY OTP";
        }

    } catch (error) {

        console.error(error);

        alert("Cannot connect to the server.");

        loginButton.textContent = "VERIFY OTP";

    } finally {

        loginButton.disabled = false;
    }

});

const resendBtn = document.getElementById("resend-otp"); 
const otpTimer = document.getElementById("otp-timer"); 
let resendTime = 60; let resendInterval; 
function startResendTimer() { resendTime = 60; resendBtn.disabled = true; 
  resendInterval = setInterval(() => { resendTime--;
     otpTimer.textContent = `Resend available in ${resendTime} seconds`; 
     if (resendTime <= 0) { clearInterval(resendInterval); 
      resendBtn.disabled = false; 
      otpTimer.textContent = "You can resend the OTP now"; } }, 1000); }
       resendBtn.addEventListener("click", async () => { const email = document.getElementById("email").value.trim(); 
       if (!email) { alert("Please enter your email first."); 
       return; } 
       resendBtn.disabled = true; 
       resendBtn.textContent = "SENDING..."; 
       try { const response = await fetch("http://localhost:3000/send-otp",
        { method: "POST", headers: { "Content-Type": "application/json" }, 
        body: JSON.stringify({ email: email }) }); 
        const data = await response.json();
         if (data.success) { alert("New OTP sent successfully!");
          document.getElementById("otp").value = ""; resendBtn.textContent = "RESEND OTP";
           startResendTimer(); } else { alert(data.message); resendBtn.disabled = false; 
            resendBtn.textContent = "RESEND OTP"; } } catch (error) { console.error(error);
               alert("Unable to send OTP. Please try again."); resendBtn.disabled = false;
                resendBtn.textContent = "RESEND OTP"; } });
  </script>
